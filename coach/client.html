<!--
  CLIENT VIEW, presenter mode (Coach Mode, D-344, docs/COACH-MODE.md 3.3).

  1. READS   one client's household (?client=, switched to for this tab),
             or a frozen snapshot of it (?snap=, read-only). Nothing from
             the roster but that client's name, next date and the blocks
             marked "show client". coach/clientview.js keeps only shared
             notes, homework and check-in dates from the coach record.
  2. WRITES  a check-in (F3), through Ownership to the rows that own each
             balance, and the check-in record itself. Nothing else.
  3. SHOWS   the life map, each goal and when it lands, what changed since
             the last session, homework and the next session. Phone first.

  Never on this page: coach notes, the path's scripts, the roster, another
  client, a link to Coach Home in presenter mode.

  LIVE-FORM: built once. The four sections are drawn into #view, which holds
  no input. The check-in form is built on open and again only after a save,
  never while it is being typed in.
-->
</head>
<body class="slaf">
<main class="client" id="main">
  <div class="presenter-bar no-print" id="presenter-bar"></div>
  <div id="view"></div>

  <section class="slaf-card" id="checkin" hidden>
    <h2>This month's check-in</h2>
    <p class="coach-note">Only what moved. Leave a box empty if you do not know: empty is not zero.</p>
    <form id="ci-form" autocomplete="off">
      <div class="row"><label class="inline">Date<input type="date" id="ci-date"/></label>
        <label class="inline">Filled in by<select id="ci-by"><option value="client">The client</option><option value="coach">The coach, from a message</option></select></label></div>
      <div id="ci-balances" style="margin-top:var(--space-2)"></div>
      <div class="row" style="margin-top:var(--space-2)"><label class="inline">Income this month, if it was different<input type="text" inputmode="decimal" id="ci-income"/></label></div>
      <p class="slaf-label" style="margin:var(--space-3) 0 var(--space-1)">How are you feeling about money? (1 is awful, 5 is great)</p>
      <div class="feel" id="ci-feel"></div>
      <label class="inline" style="width:100%;margin-top:var(--space-2)">Anything to say<textarea id="ci-text" maxlength="2000"></textarea></label>
      <div id="ci-homework" style="margin-top:var(--space-2)"></div>
      <button type="submit" class="slaf-btn slaf-btn--primary" style="margin-top:var(--space-2)">Save the check-in</button>
      <p class="coach-say" id="ci-say" role="status"></p>
    </form>
  </section>
  <p class="disclaimer">Prepared with your coach. Not investment advice.</p>
</main>
