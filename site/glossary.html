<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; worker-src 'self' blob:"/>
<script src="../shared/errlog.js"></script>
<title>Glossary · SPARKS</title>
<meta name="description" content="Every term the FIRE community and the SPARKS rooms use, in one plain sentence each, written for someone who has never had a finance conversation."/>
<meta property="og:title" content="Glossary · SPARKS"/>
<meta property="og:description" content="Nearly four hundred money terms, one plain sentence each."/>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="../shared/fonts.css"/>
<link rel="stylesheet" href="../shared/theme.css"/>
<link rel="stylesheet" href="site.css"/>
<!--
  GLOSSARY, the app's own dictionary, readable without the app. SD-005.

  1. READS   shared/glossary.json, the one file the rooms' gloss popovers
             read (shared/glossary.js). Nothing is retyped here.
  2. WRITES  nothing.
  3. CALLS   nothing.

  LIVE-FORM: built once. The search box is in the HTML and never rebuilt;
  only #gloss is repainted as the person types.
-->
</head>
<body class="slaf site">
<header class="site-head" id="site-head"></header>
<main id="main" class="site-wrap">
  <section class="site-hero" aria-labelledby="h-gloss" style="padding-bottom: var(--space-4)">
    <span class="slaf-eyebrow">Glossary</span>
    <h1 id="h-gloss">Every word, one plain sentence.</h1>
    <p class="lede">The same dictionary the rooms open when you tap a term. Written for a reader who has never had a finance conversation, and kept to one sentence each.</p>
    <div class="site-search"><label class="slaf-eyebrow" for="q">Find a word</label><input id="q" type="search" placeholder="withdrawal rate, Roth, coast, DTI" autocomplete="off"/></div>
    <p class="site-count" id="count"></p>
  </section>
  <div class="site-gloss" id="gloss"><p class="site-empty">Loading the dictionary.</p></div>
</main>
<footer class="site-foot" id="site-foot"></footer>
<script src="site.js"></script>
<script>
(function () {
  'use strict';
  Site.head('glossary'); Site.foot();
  var esc = Site.esc;
  var ORDER = ['fi', 'basics', 'income', 'budgeting', 'safety', 'debt', 'assets', 'investing', 'retirement', 'taxes', 'health', 'insurance', 'housing', 'transportation', 'student loans', 'kids', 'estate', 'giving', 'benchmarks', 'app'];
  var NAMES = { fi: 'Financial independence', basics: 'The basics', income: 'Income', budgeting: 'The month', safety: 'Safety', debt: 'Debt', assets: 'Assets', investing: 'Investing', retirement: 'Retirement accounts', taxes: 'Taxes', health: 'Health', insurance: 'Insurance', housing: 'Housing', transportation: 'Getting around', 'student loans': 'Student loans', kids: 'Kids', estate: 'The estate', giving: 'Giving', benchmarks: 'Benchmarks', app: 'Words this app uses' };
  var terms = [];
  var host = document.getElementById('gloss'), count = document.getElementById('count'), q = document.getElementById('q');

  function paint() {
    var needle = q.value.trim().toLowerCase();
    var hit = terms.filter(function (t) {
      if (!needle) return true;
      var hay = [t.term].concat(t.also || []).join(' ').toLowerCase();
      return hay.indexOf(needle) !== -1 || t.plain.toLowerCase().indexOf(needle) !== -1;
    });
    var groups = {};
    hit.forEach(function (t) { (groups[t.domain] = groups[t.domain] || []).push(t); });
    var domains = ORDER.filter(function (d) { return groups[d]; }).concat(Object.keys(groups).filter(function (d) { return ORDER.indexOf(d) === -1; }));
    var html = domains.map(function (d) {
      var list = groups[d].slice().sort(function (a, b) { return a.term.localeCompare(b.term); });
      return '<h3 id="d-' + esc(d.replace(/\s+/g, '-')) + '">' + esc(NAMES[d] || d) + '</h3><dl>' + list.map(function (t) {
        var also = (t.also && t.also.length) ? '<small>also ' + esc(t.also.join(', ')) + '</small>' : '';
        return '<dt>' + esc(t.term) + also + '</dt><dd>' + esc(t.plain) + '</dd>';
      }).join('') + '</dl>';
    }).join('');
    host.innerHTML = html || '<p class="site-empty">Nothing matches that. Try a shorter word.</p>';
    count.textContent = needle ? hit.length + ' of ' + terms.length + ' terms' : terms.length + ' terms in ' + domains.length + ' groups';
  }
  q.addEventListener('input', paint);
  fetch('../shared/glossary.json').then(function (r) { if (!r.ok) throw new Error('glossary ' + r.status); return r.json(); }).then(function (g) {
    terms = g.terms || [];
    paint();
  }).catch(function (e) {
    host.innerHTML = '<p class="site-empty">The dictionary did not load. Open this page over http, not from a file.</p>';
    if (window.ErrLog) window.ErrLog.record('load', String(e && e.message), 'site/glossary');
  });
})();
</script>
</body>
</html>
