<!--
  ROOM SPEC — SPEC.md §11.

  1. READS   household.people[0].dob (age), incomeSources[].grossAnnualIncome-
             Cents and .employerMatch, assets[] cash, debts[],
             expenses.monthlyEssential.
  2. WRITES  Nothing yet, beyond registerRoom(). This room seeds itself from
             the household, but its step-by-step inputs (deductible target,
             Roth/HSA contributed so far, prepaid goals) have no home in the
             schema until the Cash Flow and Goal Costing engines land.
             Tracked in DECISIONS.md D-010.
  3. CALLS   Its own month-by-month waterfall simulation — the only thing in
             the app that answers "when does each step land". engines/foo.js
             answers a different question ("which step are you on now") and
             is not a duplicate of it; D-010 records why both exist.
  4. EMPTY   Every numeric input ships blank. The gap engine needs income and
             expenses before it shows a figure; the timeline needs its full
             input set and says which are missing; each step card
             independently reports what it still needs.
  5. CONFIG  data/irs_limits_2026.json for contribution limits;
             data/effective_tax_rates_2026.json for the take-home pay the
             waterfall actually pours (via engines/tier0.js).

  The ladder lived at the site root until BRIEF §1.2 made the dashboard the
  front door (DECISIONS.md D-058). Its script stays at the repo root as
  foo-ladder.js; only this shell moved.
-->
