<!--
  REDIRECT — Start Here is the Ledger's all-at-once view (rooms/ledger.html#all-at-once,
  DECISIONS.md D-229, D-234).

  The one-pager asked seventeen questions and owned all seventeen answers,
  more than any other room in the app. D-234 moved every one of them to the
  room where it changes a decision: filing, state and ZIP to Tax; the annual
  gross to Income; the 401(k) card to Where It Goes; cash and investments to
  the Statement; the deductible and the two between-jobs facts to the
  Cushion; "do you owe anything" to Debt; and who you are to Settings. With
  nothing left to own, the page is the Ledger's all-at-once view, which asks
  every question in the app rather than seventeen of them.

  The file stays so every link already out in the world keeps landing, hash
  included, and each old question lands on the room that asks it now.
  LIVE-FORM: built once. No inputs.
-->

<main class="slaf-wrap">
  <p style="color:var(--color-text-muted)">Start Here is the Ledger's all-at-once view now, and each of its questions is asked in the room that owns the answer.
    <a href="ledger.html#all-at-once" id="go">Open it →</a></p>
</main>
<script>
  /* Carry the deep link across. Start Here's anchors did not all go to one
     room, so this maps a question to the page that asks it now (D-234). */
  (function () {
    var map = {
      '#q-employment':  'settings.html#you',
      '#q-about':       'settings.html#you',
      '#q-fine-tune':   'settings.html#you',
      '#q-income':      'income.html#sources',
      '#q-own-work':    'income.html#sources',
      '#q-cash':        'statement.html#assets',
      '#q-investments': 'statement.html#assets',
      '#q-expenses':    'expenses.html#spending',
      '#q-plan':        'accounts.html#setup',
      '#q-debt':        'debt-payoff.html#debts',
      '#q-deductible':  'runway.html#coverage',
      '#q-unemployed':  'runway.html#job-hunting',
      '#q-partner':     'partner.html#inputs',
      '#q-import':      'ledger.html#all-at-once'
    };
    var target = map[location.hash || ''] || 'ledger.html#all-at-once';
    document.getElementById('go').setAttribute('href', target);
    location.replace(target);
  })();
</script>
