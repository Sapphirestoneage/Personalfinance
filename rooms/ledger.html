<!--
  ROOM SPEC — SPEC.md §11. THE LEDGER. DECISIONS.md D-185 (18.4, 18.5).

  1. READS   data/ledger-rows.json (every number, one row) and
             data/spheres.json (the nine spheres, in order) through
             shared/ledger-rows.js and shared/spheres.js; the household
             through the ownership map, never a private copy.
  2. SHOWS   the target: five DAITE wedges by nine rings, 45 cells, filled
             for sure, half for roughly, empty for missing, dashed for
             stale; one line under it (sphere N of 9, the virtue, rows
             left, minutes); then the rows, grouped by sphere then letter,
             each numbered inside its sphere, later spheres under a fold.
  3. WRITES  nothing yet. A row's tap target is its owner room's box until
             18.1 moves entry here; the search box is the only control.

  THE DOORS (D-207): the home is six doors, D A I T E You, each with its
  headline, a "k of n known" ring and the say line; one is recommended with
  its reason. A door opens to its level (1 how much, 2 where it sits, 3 what
  it is made of, 4 what it costs and where it came from), the insight that
  level unlocks, then three groups only: Confirm these, Add these (the next
  three), and "N more unlock as you use the app". The nine spheres stay,
  under a fold, until their fate is decided (D-207 proposes it).

  LIVE-FORM: built once. The search box is in the HTML and only its value
  is read; every list below it holds no inputs and is rewritten freely.
-->

<script>
(function () {
  var Money = SLAF.Money, Spine = SLAF.Spine, Ownership = SLAF.Ownership, Registry = SLAF.Registry, Progress = SLAF.Progress,
      LedgerRows = SLAF.LedgerRows, Spheres = SLAF.Spheres, Reference = SLAF.Reference, Suggest = SLAF.Suggest;
  var Doors = SLAF.Doors;
  var TABLES = {};
  var SUGGESTED = {};   /* key → suggestion, refreshed on every render (D-205) */
  var SUGLIST = [];
  var OPEN = null;      /* the door open now, or null for the home (D-207) */
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var GLYPH = { sure: '●', roughly: '◐', missing: '○', computed: '=', stale: '◌', suggested: '◔' };
  var WORD = { sure: 'sure', roughly: 'roughly', missing: 'not entered', computed: 'worked out', stale: 'needs a look', suggested: 'suggested, not yet yours' };

  /* ---- The target: five wedges by nine rings ------------------------------ */
  function polar(r, a) { var t = (a - 90) * Math.PI / 180; return [50 + r * Math.cos(t), 50 + r * Math.sin(t)]; }
  function cellPath(r0, r1, a0, a1) {
    var p0 = polar(r1, a0), p1 = polar(r1, a1), p2 = polar(r0, a1), p3 = polar(r0, a0);
    return 'M' + p0[0].toFixed(2) + ',' + p0[1].toFixed(2) + ' A' + r1 + ',' + r1 + ' 0 0 1 ' + p1[0].toFixed(2) + ',' + p1[1].toFixed(2)
      + ' L' + p2[0].toFixed(2) + ',' + p2[1].toFixed(2) + ' A' + r0 + ',' + r0 + ' 0 0 0 ' + p3[0].toFixed(2) + ',' + p3[1].toFixed(2) + 'Z';
  }
  function paintTarget(h) {
    var cells = Spheres.cells(h, TABLES);
    var parts = [];
    var letters = Spheres.LETTERS, step = 360 / letters.length, inner = 8, outer = 44, ring = (outer - inner) / 9;
    cells.forEach(function (c) {
      var li = letters.indexOf(c.letter);
      var r0 = inner + (c.order - 1) * ring, r1 = r0 + ring - 0.4;
      var a0 = li * step + 1, a1 = (li + 1) * step - 1;
      var title = c.letter + ' at sphere ' + c.order + ': ' + (c.rows.length ? c.rows.length + ' row' + (c.rows.length === 1 ? '' : 's') + ', ' + c.fill : 'no rows');
      parts.push('<path class="cell is-' + c.fill + '" data-cell="' + c.letter + c.order + '" d="' + cellPath(r0, r1, a0, a1) + '"><title>' + esc(title) + '</title></path>');
    });
    letters.forEach(function (L, i) {
      var p = polar(outer + 4, i * step + step / 2);
      parts.push('<text class="wedge-label" x="' + p[0].toFixed(1) + '" y="' + (p[1] + 3).toFixed(1) + '" text-anchor="middle">' + L + '</text>');
    });
    el('target').innerHTML = parts.join('');
  }
  function paintLine(st) {
    var s = st.current;
    var line;
    if (!s) {
      line = '<b>Every sphere is complete.</b> ' + (st.sharpThrough === st.spheres.length ? 'And every number is sure.' : 'Sharpen the rough ones when you have a minute.');
    } else {
      var c = s.counts;
      line = '<b>Sphere ' + s.order + ' of 9, ' + esc(s.virtue) + '.</b> ' + c.open + ' row' + (c.open === 1 ? '' : 's') + ' left, about ' + minutesWord(s.minutesLeft) + '.'
        + (s.alreadyGood ? ' This is already enough for most people.' : '');
    }
    el('target-line').innerHTML = line;
  }
  function minutesWord(m) { if (!Money.isEntered(m)) return '?'; if (m < 1) return 'a minute'; var n = Math.round(m); return n + ' minute' + (n === 1 ? '' : 's'); }

  /* ---- The rows ----------------------------------------------------------- */
  function valueOf(row) {
    if (row.kind === 'computed') return Money.isOk(row.result) ? Ownership.describe(row.id, Spine.getProfile(), 'ledger').display : (row.result.reason || 'Needs its inputs.');
    if (row.repeat) return row.entered ? row.result.value + ' listed' : '';
    if (!row.entered) return '';
    var d = Ownership.FIELDS[row.id] ? Ownership.describe(row.id, Spine.getProfile(), 'ledger') : null;
    if (d) return d.display;
    return Money.isOk(row.result) ? String(row.result.value) : '';
  }
  function target(row) {
    if (/^prefs\./.test(row.path)) return Ownership.linkTo('doors', 'inputs', 'ledger');
    var f = Ownership.FIELDS[row.id];
    if (!f) return null;
    return Ownership.linkTo(f.owner, f.anchor, 'ledger');
  }
  function sourceLine(row) {
    if (!row.entered || !row.meta) return '';
    var bits = [];
    if (row.meta.source) bits.push(row.meta.source);
    if (row.meta.asOf) { var d = new Date(row.meta.asOf); if (!isNaN(d.getTime())) bits.push('as of ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })); }
    if (row.status === 'stale' && Money.isEntered(row.days)) bits.push(row.days + ' days old');
    return bits.join(' · ');
  }
  function readersLine(row) {
    var rs = LedgerRows.readersOf(row).filter(function (r) { return r.id !== 'ledger'; }).slice(0, 4);
    if (!rs.length) return '';
    return '<span class="reads">Read by ' + rs.map(function (r) { return '<a href="../' + esc(r.href) + '">' + esc(r.title) + '</a>'; }).join('') + '</span>';
  }
  function rowHtml(row, n, of) {
    var st = row.status, val = valueOf(row), href = target(row);
    var lab = '<span class="lab">' + esc(row.label) + '<span class="num">' + n + ' of ' + of + '</span></span>';
    var valCell = st === 'computed'
      ? '<span class="val">' + esc(val) + '</span>'
      : href
        ? '<span class="val"><a href="' + esc(href) + '">' + (val ? esc(val) : (row.kind === 'lookup' ? 'Look it up' : 'Enter it')) + '</a></span>'
        : '<span class="val">' + esc(val) + '</span>';
    var sug = st === 'missing' && !row.repeat ? SUGGESTED[row.id] : null;
    if (sug && !sug.na) {
      st = 'suggested';
      valCell = '<span class="val is-suggested"><button type="button" class="slaf-btn slaf-btn--quiet use-it" data-use="' + esc(sug.key) + '">' + esc(sug.display) + ' · use it</button></span>';
    } else if (sug && sug.na) {
      st = 'suggested';
      valCell = '<span class="val is-na">' + esc(sug.display) + '</span>';
    }
    var out = '<li class="row is-' + st + '" data-row="' + esc(row.id) + '" data-status="' + st + '">'
      + '<span class="g" title="' + esc(WORD[st]) + '">' + GLYPH[st] + '</span>' + lab + valCell;
    if (sug) {
      out += '<span class="small how"><details><summary>How I guessed this</summary>' + esc(sug.how) + ' <span class="src">' + esc(sug.sources.join(', ')) + '</span></details></span>';
    }
    if (st === 'computed') {
      var inputs = LedgerRows.inputsOf(row, Spine.getProfile(), TABLES);
      out += '<span class="small">' + esc(row.engine.split('.')[1] === 'netWorth' ? 'What you own less what you owe' : 'Worked out from ') + (row.engine.split('.')[1] === 'netWorth' ? ': ' : '')
        + inputs.map(function (i) { return i.row ? (i.missing ? '<a href="#row-' + esc(i.id) + '">' + esc(i.row.label) + ' (missing)</a>' : esc(i.row.label)) : esc(i.id); }).join(', ') + '.</span>';
    } else if (!row.entered && row.kind === 'lookup' && row.where) {
      out += '<span class="where">' + esc(row.where) + '</span>';
    } else if (row.entered) {
      var src = sourceLine(row);
      if (src) out += '<span class="small">' + esc(src) + '</span>';
    }
    var reads = readersLine(row);
    if (reads) out += '<span class="small">' + reads + '</span>';
    return out + '</li>';
  }
  var LETTER_WORD = { D: 'Debt', A: 'Assets', I: 'Income', T: 'Taxes', E: 'Expenses', you: 'About you' };
  function sphereHtml(s, query) {
    var rows = s.rows.filter(function (r) { return !query || r.label.toLowerCase().indexOf(query) >= 0; });
    if (query && !rows.length) return '';
    var groups = [];
    ['you', 'D', 'A', 'I', 'T', 'E'].forEach(function (L) {
      var mine = rows.filter(function (r) { return (L === 'you' ? r.family === 'you' : r.letter === L); });
      if (mine.length) groups.push({ L: L, rows: mine });
    });
    var n = 0, of = s.rows.length;
    var body = groups.map(function (g) {
      return '<div class="letter"><div class="letter-head">' + esc(LETTER_WORD[g.L]) + '</div><ul class="rows">'
        + g.rows.map(function (r) { n++; return rowHtml(r, s.rows.indexOf(r) + 1, of); }).join('') + '</ul></div>';
    }).join('');
    var c = s.counts;
    var count = c.applicable ? (c.sharp ? 'all sure' : c.complete ? 'all entered, ' + c.roughly + ' rough' : c.open + ' of ' + c.applicable + ' left') : 'no rows yet';
    return '<section class="sphere' + (s.complete ? ' is-complete' : '') + '" id="sphere-' + esc(s.id) + '" data-sphere="' + esc(s.id) + '">'
      + '<div class="sphere-head"><span class="sphere-num">' + s.order + '</span><h2 class="sphere-title">' + esc(s.virtue) + '</h2><span class="sphere-count">' + esc(count) + (c.open ? ' · about ' + minutesWord(s.minutesLeft) : '') + '</span></div>'
      + '<p class="sphere-line">' + esc(s.virtueLine) + '</p>'
      + (s.alreadyGood ? '<p class="good">This is already good.</p>' : '')
      + (s.rows.length ? body : '<p class="slaf-hint">Nothing to enter here yet: the time budget adds the hours and the price of a day off.</p>')
      + '</section>';
  }
  function paintSpheres(st) {
    var query = (el('q').value || '').trim().toLowerCase();
    var cur = st.currentOrder;
    var open = st.spheres.filter(function (s) { return query || s.order <= cur; });
    var later = st.spheres.filter(function (s) { return !query && s.order > cur; });
    var html = open.map(function (s) { return sphereHtml(s, query); }).join('');
    if (later.length) {
      html += '<details class="fold" id="later"><summary>The later spheres, ' + later[0].order + ' to 9: visible now, sharper later</summary>'
        + later.map(function (s) { return sphereHtml(s, ''); }).join('') + '</details>';
    }
    el('spheres').innerHTML = html || '<p class="slaf-reason">No row matches that.</p>';
  }
  function refreshSuggestions(h) {
    SUGGESTED = {};
    SUGLIST = Suggest.suggestions(h, TABLES);
    SUGLIST.forEach(function (s) { if (!s.itemId) SUGGESTED[s.rowId] = s; SUGGESTED[s.key] = s; });
  }

  /* ---- The doors (D-207) --------------------------------------------------- */
  function ring(known, total) {
    var r = 15, c = 2 * Math.PI * r, share = total ? known / total : 0;
    return '<svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="' + r + '" fill="none" stroke="var(--color-border)" stroke-width="3"/>'
      + '<circle cx="18" cy="18" r="' + r + '" fill="none" stroke="var(--color-accent)" stroke-width="3" stroke-dasharray="' + (c * share).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 18 18)"/>'
      + '<text x="18" y="21" text-anchor="middle">' + known + '</text></svg>';
  }
  function paintHome(h) {
    var rec = Doors.recommend(h, TABLES, SUGLIST);
    el('doors').innerHTML = Doors.DOORS.map(function (d) {
      var c = Doors.counts(h, TABLES, d.id, SUGLIST);
      var hl = Doors.headline(h, TABLES, d.id);
      var isRec = rec.door === d.id;
      return '<a class="door' + (isRec ? ' is-recommended' : '') + '" href="#door-' + esc(d.id) + '" data-door="' + esc(d.id) + '">'
        + ring(c.known, c.total) + '<span class="ringlab">' + c.known + ' of ' + c.total + '</span>'
        + '<span class="letter">' + esc(d.letter) + '</span><span class="label">' + esc(d.label) + '</span><span class="say">' + esc(d.say) + '</span>'
        + '<span class="num' + (hl.display === 'not entered yet' ? ' is-blank' : '') + '">' + esc(hl.display) + '</span><span class="numlab">' + esc(hl.label) + '</span>'
        + (isRec ? '<span class="why">' + esc(rec.reason) + '</span>' : '')
        + '</a>';
    }).join('');
    var u = Doors.understanding(h, TABLES, SUGLIST, TABLES.confidenceWeights);
    el('understand').innerHTML = 'You understand <b>' + u.percent + '%</b> of your financial picture.';
  }
  function levelWord(n) { return ['', 'How much', 'Where it sits', 'What it is made of', 'What it costs and where it came from'][n]; }
  function paintDoor(h, id) {
    var v = Doors.doorView(h, TABLES, id, SUGLIST);
    var d = v.door, hl = Doors.headline(h, TABLES, id);
    var out = '<div class="head"><span class="letter">' + esc(d.letter) + '</span><h2>' + esc(d.label) + '</h2><span class="say">' + esc(d.say) + '</span><a class="back" href="#doors-home">← Every door</a></div>'
      + '<p class="headline' + (hl.display === 'not entered yet' ? ' is-blank' : '') + '">' + esc(hl.display) + '</p><p class="slaf-hint">' + esc(hl.label) + ' · ' + v.counts.known + ' of ' + v.counts.total + ' known</p>'
      + '<div class="lvl"><span class="now">Level ' + v.level + ' of 4</span><div class="name">' + esc(levelWord(v.level)) + '</div>'
      + (v.next ? '<div class="next">Level ' + v.next.level + ', ' + esc(v.next.info.label.toLowerCase()) + ', unlocks ' + esc(v.next.unlocks.slice(0, 2).join('; ') || v.next.info.gloss) + '.</div>' : '<div class="next">The deepest level. Sharpen what is rough when you have a minute.</div>')
      + '</div>';
    v.insights.forEach(function (ins) {
      out += '<div class="insight" data-level="' + ins.level + '">' + (ins.level !== v.level ? '<div class="slaf-hint">From level ' + ins.level + ', ' + esc(levelWord(ins.level).toLowerCase()) + '</div>' : '') + '<div class="big">' + esc(ins.headline) + '</div><div class="line">' + esc(ins.line) + '</div>'
        + (ins.rough ? '<div class="rough">Rough' + (ins.missing.length ? ': still needs ' + esc(ins.missing.slice(0, 3).join(', ')) : '') + '.</div>' : '') + '</div>';
    });
    if (v.confirm.length) {
      out += '<div class="group"><h3>Confirm these</h3><ul class="rows">' + v.confirm.map(function (s) {
        return '<li class="row is-suggested" data-row="' + esc(s.rowId) + '" data-status="suggested"><span class="g" title="suggested, not yet yours">' + GLYPH.suggested + '</span><span class="lab">' + esc(s.label) + '</span>'
          + '<span class="val is-suggested"><button type="button" class="slaf-btn slaf-btn--quiet use-it" data-use="' + esc(s.key) + '">' + esc(s.display) + ' · use it</button></span>'
          + '<span class="small how"><details><summary>How I guessed this</summary>' + esc(s.how) + ' <span class="src">' + esc(s.sources.join(', ')) + '</span></details></span></li>';
      }).join('') + '</ul></div>';
    }
    if (v.add.length) {
      out += '<div class="group"><h3>Add these</h3><ul class="rows">' + v.add.map(function (r) {
        var href = target(r);
        return '<li class="row is-missing" data-row="' + esc(r.id) + '" data-status="missing"><span class="g" title="not entered">' + GLYPH.missing + '</span><span class="lab">' + esc(r.label) + '</span>'
          + '<span class="val">' + (href ? '<a href="' + esc(href) + '">' + (r.kind === 'lookup' ? 'Look it up' : 'Enter it') + '</a>' : '') + '</span>'
          + (r.kind === 'lookup' && r.where ? '<span class="where">' + esc(r.where) + '</span>' : '')
          + '<span class="small">Unlocks ' + esc(r.unlocks) + '.</span></li>';
      }).join('') + '</ul></div>';
    }
    if (v.na.length) out += '<p class="na">' + v.na.map(function (s) { return esc(s.label) + ': ' + esc(s.how); }).join(' ') + '</p>';
    if (v.more) out += '<p class="more">' + v.more + ' more unlock as you use the app.</p>';
    else if (!v.add.length && !v.confirm.length) out += '<p class="more">Every row behind this door is in.</p>';
    el('door-' + id).innerHTML = out;
  }
  function showDoor(id) {
    OPEN = id;
    Doors.DOORS.forEach(function (d) { el('door-' + d.id).hidden = d.id !== id; });
    el('doors-home').hidden = !!id;
    el('lede-home').textContent = id ? 'One door at a time. Confirm what is suggested, add the next three, and the rest unlocks as you go.' : 'Which one do you want to go into now?';
    if (id) paintDoor(Spine.getProfile(), id);
  }
  function routeHash() {
    var m = /^#door-(D|A|I|T|E|you)$/.exec(location.hash || '');
    showDoor(m ? m[1] : null);
    if (!m && location.hash === '#doors-home') { try { history.replaceState(null, '', location.pathname); } catch (e) { /* fine */ } }
  }

  /* ---- Search: any row, any time ---------------------------------------- */
  function paintFound() {
    var query = (el('q').value || '').trim().toLowerCase();
    var box = el('found');
    if (!query) { box.hidden = true; box.innerHTML = ''; return; }
    var rows = LedgerRows.rows(Spine.getProfile(), TABLES, { filter: 'all', query: query });
    box.hidden = false;
    box.innerHTML = rows.length ? '<ul class="rows">' + rows.map(function (r, i) { return rowHtml(r, i + 1, rows.length); }).join('') + '</ul>' : '<p class="slaf-reason">No row matches that.</p>';
  }

  function render() {
    var h = Spine.getProfile();
    refreshSuggestions(h);
    paintHome(h);
    if (OPEN) paintDoor(h, OPEN);
    paintFound();
    var st = Spheres.state(h, TABLES);
    paintTarget(h);
    paintLine(st);
    paintSpheres(st);
  }

  el('q').addEventListener('input', function () { paintFound(); paintSpheres(Spheres.state(Spine.getProfile(), TABLES)); });
  /* One tap turns a suggestion into an entered value, through its owner. */
  document.querySelector('main').addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('[data-use]') : null;
    if (!b) return;
    var s = SUGGESTED[b.getAttribute('data-use')];
    if (s) Suggest.confirm(s);
  });
  window.addEventListener('hashchange', routeHash);
  Spine.registerRoom('ledger');
  Spine.onChange(render);
  Progress.mountHeader('ledger');
  Progress.mount('ledger');
  SLAF.Backup.mount('#backup');
  Reference.load(['ledgerRows', 'spheres', 'staleness', 'confidenceWeights', 'accessRules', 'effectiveTaxRates'].concat(Suggest.TABLES)).then(function (t) {
    TABLES = t || {};
    LedgerRows.use(TABLES.ledgerRows);
    Spheres.use(TABLES.spheres);
    routeHash();
    if (SLAF.Staleness && TABLES.staleness) SLAF.Staleness.use(TABLES.staleness);
    render();
  }).catch(function (err) {
    el('target-line').textContent = 'The rows could not be loaded. (' + err + ')';
  });
})();
</script>
</body>
</html>
