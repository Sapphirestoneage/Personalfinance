<!doctype html>
<!-- SLAM: the Session is a mode of Numbers now (Guide me, S-280). Old links land on Numbers with Guide me on, at the
     step where the call stopped. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Guide me</title>
  <meta http-equiv="refresh" content="0; url=ledger.html?guide=1">
  <script>
    (function () {
      var map = { taxes: 'income' }, step = null;
      var h = location.hash.replace(/^#\/?/, '').split('/')[0];
      if (h === 'end') { location.replace('dashboard.html#/end'); return; }
      try { var reg = JSON.parse(localStorage.getItem('slam-clients:v1') || 'null'); var last = JSON.parse(localStorage.getItem('slam-last-step:v1') || '{}'); step = h || last[(reg && reg.current) || 'example'] || null; } catch (e) { step = h || null; }
      if (step) step = map[step] || step;
      location.replace('ledger.html?guide=1' + (step ? '#/' + step : ''));
    })();
  </script>
</head>
<body>
  <p><a href="ledger.html?guide=1">Open Guide me</a></p>
</body>
</html>
