# Every push and pull request runs the current build's checks. The Pages
# publish in pages.yml waits on this workflow, so a red suite never ships.
# The retired generations under archive/ keep their own suites in
# archive.yml, which runs when something under archive/ changes, or on demand.
name: test
on:
  push:
  pull_request:
  workflow_call:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SLAM unit tests (slam/README.md)
        working-directory: slam
        run: node --test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SLAM screen checks, journeys and layout (Playwright)
        run: |
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium
          (cd slam && python3 -m http.server 8765 >/dev/null 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/index.html >/dev/null && break; sleep 1; done
          export NODE_PATH="$PWD/node_modules"
          node slam/tools/screens-check.mjs
          node slam/tools/journeys.mjs
          node slam/tools/layout-check.mjs
