# Every push and pull request runs the whole suite (D-204). The Pages
# publish in pages.yml waits on this same job, so a red suite never ships.
name: test
on:
  push:
  pull_request:
  workflow_call:
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit, D&D, export, spreadsheet
        run: |
          node test/run.js
          node test/solar.js
          node dnd/test/run.js
          node coach/test/run.js
          node marketing/test/run.js
          node test/export.js
          node test/xlsx.js
      - name: Lane 2 (corpus, properties, data, glossary, migration, QR)
        working-directory: tests
        run: |
          npm ci
          npm test
      - name: Browser gates
        run: |
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/index.html >/dev/null && break; sleep 1; done
          export NODE_PATH="$PWD/node_modules"
          node test/render.js
          node test/features.js
          node test/sidebar.js
          node test/forms.js
          node test/anchors.js
          node test/flow.js
          node test/opening.js
          node test/statement.js
          node test/onefact.js
          node test/xss.js
          node test/comeback.js
          node test/alignment.js

  # SLAM Profit Engine (slam/): a separate app with its own toolchain.
  slam:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: slam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slam/package-lock.json
      - run: npm ci
      - name: Typecheck, engine and golden tests, build
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Phone flows against the build
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
